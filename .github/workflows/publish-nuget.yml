# Publishes the OpenCdsi.VaxEngine package to GitHub Packages whenever an engine-vX.Y.Z tag is
# pushed to main. This repo is a monorepo containing several independently-released
# solutions (Engine, Backend, Mobile), each tagged with its own prefix - this workflow only
# reacts to the engine-v prefix, so an api/mobile-only release doesn't touch this
# package at all, and this package's own release doesn't trigger anyone else's build.
#
# Deliberately narrow in scope: this workflow only builds and publishes src/OpenCdsi.VaxEngine.Core - the one
# project actually meant for external, NuGet consumption (e.g. a .NET MAUI app referencing it).
# OpenCdsi.VaxEngine.Api/OpenCdsi.VaxEngine.Demo and the reference data under data/ are not part of this -
# they're deployed differently (see the repo's own Dockerfile/docker-compose.yml), and bundling
# them into this package would contradict the project's own stated goal of keeping schedule data
# externally updatable without a new package release (see OpenCdsi.VaxEngine.Core.csproj's own comments).
# Note this package is now purely for external consumers - this repo's own Mobile app references
# Core via a same-repo ProjectReference instead, so it doesn't depend on this publish step at all.
#
# Core.csproj no longer hardcodes <Version> - MinVer (see its csproj) computes it from this same
# engine-v* tag at build/pack time, so there's nothing to keep in sync by hand. This workflow
# still does its own tag validation up front (see below) purely as an early, clear failure for a
# malformed tag, and still checks the packed .nupkg's filename against the tag afterward as a
# safety net in case MinVer somehow computed something different (e.g. a misconfigured checkout
# that didn't actually fetch tags).
#
# Two safety checks run BEFORE anything gets built or published, since a wrong version number or
# a tag placed on the wrong branch is much harder to undo once a package is live on the registry
# than it would be to catch here first:
#   1. The tag itself must be a real, valid semver (with the "engine-v" prefix this monorepo's own
#      convention uses) - not just "looks vaguely like dots and numbers," which is all the
#      workflow-level trigger filter below can check on its own.
#   2. The tagged commit must actually be reachable from main - matching "add a new semver tag to
#      the main branch" literally, not just "any tag anywhere in the repo, on any branch."
#
# The trigger pattern (engine-v*.*.*) is deliberately permissive - GitHub Actions' own tag-filter
# glob syntax can't express a real semver pattern - so the real validation happens in the
# "Validate tag is real semver" step below, with a clear, specific failure message rather than a
# vague build error if someone pushes something like "engine-v1.2" by mistake.

name: Publish OpenCdsi.VaxEngine to GitHub Packages

on:
  push:
    tags:
      - 'engine-v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history AND tags needed - both for the "is this tag reachable
                          # from main" check below, and for MinVer to see engine-v* tags at all

      - name: Validate tag is real semver
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Full semver 2.0.0 pattern (semver.org's own regex), applied after stripping the
          # required leading "engine-v" - rejects things like "engine-v1.2" or "v1.2.3" (missing
          # the engine- prefix) with a clear message rather than letting a malformed version
          # reach `dotnet pack` and fail there instead.
          if [[ ! "$TAG" =~ ^engine-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$ ]]; then
            echo "::error::Tag '$TAG' is not a valid semver tag (expected format: engine-v1.2.3, with an optional -prerelease or +build suffix). Not publishing."
            exit 1
          fi
          VERSION="${TAG#engine-v}" # NuGet's own Version property doesn't take the "engine-v" prefix
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Validated tag $TAG -> expecting package version $VERSION (MinVer computes this independently at pack time - verified below)"

      - name: Verify tag is reachable from main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (commit ${GITHUB_SHA}) is not reachable from main. Refusing to publish a package from a tag that isn't actually on the main branch."
            exit 1
          fi
          echo "Confirmed: ${GITHUB_REF_NAME} is reachable from main."

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/OpenCdsi.VaxEngine.Core/OpenCdsi.VaxEngine.Core.csproj

      - name: Pack
        run: >
          dotnet pack src/OpenCdsi.VaxEngine.Core/OpenCdsi.VaxEngine.Core.csproj
          -c Release
          -o ./artifacts
          --no-restore

      - name: Verify packed version matches tag
        run: |
          EXPECTED="./artifacts/OpenCdsi.VaxEngine.Core.${{ steps.version.outputs.version }}.nupkg"
          if [ ! -f "$EXPECTED" ]; then
            echo "::error::Expected $EXPECTED not found - MinVer's computed version doesn't match tag ${GITHUB_REF_NAME}. This usually means tags weren't fully fetched. Contents of ./artifacts:"
            ls ./artifacts
            exit 1
          fi
          echo "Confirmed: $EXPECTED"

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
