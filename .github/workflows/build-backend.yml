# Builds and tests Backend.slnx (Core, Contracts, Api, Functions, plus Api.Tests) on any push to
# main or PR that touches those projects, or the reference data they load.
#
# This repo is a monorepo with several independently-tagged solutions (see Engine.slnx,
# Backend.slnx, Mobile.slnx, Platform.slnx at the root) - this workflow is scoped to Backend.slnx's
# own dependency set via the paths filter below, so a Demo/Conformance-only or Mobile-only change
# doesn't trigger it. See build-engine.yml for the Core/Contracts/Demo counterpart, and
# build-android.yml for Mobile.
#
# Api.Tests boots the real API host (WebApplicationFactory<Program>) and resolves data/ at
# runtime by walking up to Platform.slnx at the repo root (see FindDataDirectory in
# Api/Program.cs) - actions/checkout does a full, non-sparse checkout by default, so Platform.slnx
# is present even though this workflow only builds/tests Backend.slnx.

name: Build and test Backend

on:
  push:
    branches: [main]
    paths:
      - 'src/OpenCdsi.VaxEngine.Core/**'
      - 'src/OpenCdsi.VaxEngine.Contracts/**'
      - 'src/OpenCdsi.VaxEngine.Api/**'
      - 'src/OpenCdsi.VaxEngine.Functions/**'
      - 'tests/OpenCdsi.VaxEngine.Api.Tests/**'
      - 'data/**'
      - 'Backend.slnx'
  pull_request:
    paths:
      - 'src/OpenCdsi.VaxEngine.Core/**'
      - 'src/OpenCdsi.VaxEngine.Contracts/**'
      - 'src/OpenCdsi.VaxEngine.Api/**'
      - 'src/OpenCdsi.VaxEngine.Functions/**'
      - 'tests/OpenCdsi.VaxEngine.Api.Tests/**'
      - 'data/**'
      - 'Backend.slnx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Full history/tags, not just the default shallow clone - Core.csproj's MinVer needs to
        # see engine-v* tags to compute a version, even for a plain build.
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Backend.slnx

      - name: Build
        run: dotnet build Backend.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Backend.slnx -c Release --no-build --logger "console;verbosity=normal"
