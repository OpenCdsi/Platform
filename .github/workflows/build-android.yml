# Builds the app for Android and Windows (x64 and arm64) on any push/PR touching this app's own
# source or the Engine source it depends on, plus any push of a mobile-vX.Y.Z tag - which
# additionally publishes every build to a GitHub Release.
#
# Android needs the real Android SDK (platform android.jar, build-tools), which .NET's workload
# install fetches from Google's package repository at build time - a GitHub-hosted runner has
# unrestricted internet for that, unlike some sandboxed/agent dev environments. Windows needs an
# actual Windows machine to build (WinUI/Windows App SDK tooling only runs there), which is why
# build-windows uses windows-latest instead of ubuntu-latest. windows-latest is itself x64, but a
# self-contained win-arm64 publish cross-targets fine from there - the ARM64 runtime pack is just
# another NuGet package, no ARM64 host or emulation needed to produce it.
#
# Post-monorepo-migration: this app now references OpenCdsi.VaxEngine.Core via a plain
# ProjectReference (not a NuGet PackageReference), since Core's source lives in this same repo.
# That means the old GitHub Packages restore - and the classic PAT it needed (NUGET_READ_PAT),
# because the built-in GITHUB_TOKEN only covers packages published from the same repo - is gone.
# Plain `dotnet restore`/`dotnet build` picks up Core's source directly, no extra auth required.
#
# Tag prefix: this repo tags each solution's releases separately (engine-vX.Y.Z, mobile-vX.Y.Z,
# ...), so this workflow only reacts to the mobile-v* prefix - an engine-v tag alone won't build
# or release this app.
#
# NOTE: GitHub's push-event `paths` filter is well-documented for branch pushes; its exact
# behavior on tag pushes is less consistently documented. Worth confirming once this is live that
# a mobile-v* tag reliably triggers the release job regardless of the paths filter below.

name: Build OpenCdsi Mobile

on:
  push:
    branches: [main]
    paths:
      - 'src/OpenCdsi.Mobile/**'
      - 'src/OpenCdsi.VaxEngine.Core/**'
    tags: ['mobile-v*.*.*']
  pull_request:
    paths:
      - 'src/OpenCdsi.Mobile/**'
      - 'src/OpenCdsi.VaxEngine.Core/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android

      # -c Release -f net10.0-android, matching the Build step below exactly: the .NET Android
      # workload only pulls in its default multi-ABI RuntimeIdentifiers (android-arm64,
      # android-x64, ...) for Release builds, not Debug. A bare `dotnet restore` with no
      # -c/-f (the previous version of this step) restores Debug's simpler, RID-less graph, then
      # the Release build below needs the RID-specific one that was never captured - confirmed by
      # a real CI failure: NETSDK1047, "Assets file ... doesn't have a target for
      # 'net10.0/android-arm64'" on OpenCdsi.VaxEngine.Core specifically (only surfaced once Core
      # became a live ProjectReference in this migration - a compiled NuGet package never needed
      # this cross-project RID negotiation at all). No -r here since the RID list itself is
      # implicit/default for Release, not manually chosen - so this doesn't hit the documented
      # -f-plus-r `dotnet restore` bug worked around in the Windows job below.
      - name: Restore
        run: dotnet restore src/OpenCdsi.Mobile/OpenCdsi.Mobile.csproj -c Release -f net10.0-android

      # Only produces output on a tag push (empty otherwise, so a plain push/PR build keeps
      # using the ApplicationDisplayVersion/ApplicationVersion already in the csproj). Expects
      # tags shaped like v1.2.3 (a leading "v" plus MAJOR.MINOR.PATCH; a trailing -prerelease or
      # +build suffix is accepted and kept in the display version, just not the version code).
      # The push-tags filter above only loosely matches "v*.*.*" - this is the real, strict
      # semver check, and fails the build with a clear error on anything that doesn't match.
      - name: Determine version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#mobile-v}"

          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            echo "::error::Tag '$TAG' is not a valid semver version (expected mobile-vMAJOR.MINOR.PATCH, e.g. mobile-v1.2.3)"
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"

          # Android's versionCode must be a strictly increasing integer between releases - not
          # the semver string itself. Packs MAJOR/MINOR/PATCH into one int (assumes MINOR and
          # PATCH each stay under 100, which is the usual case); revisit if that ever binds.
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          echo "display_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "msbuild_args=/p:ApplicationDisplayVersion=$VERSION /p:ApplicationVersion=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build (Release, Android)
        run: >
          dotnet build src/OpenCdsi.Mobile/OpenCdsi.Mobile.csproj
          -c Release
          -f net10.0-android
          --no-restore
          ${{ steps.version.outputs.msbuild_args }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: opencdsi-mobile-android
          path: src/OpenCdsi.Mobile/bin/Release/net10.0-android/**/*-Signed.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI Windows workload
        run: dotnet workload install maui-windows

      # Same version-stamping as the Android job (see its own comment above) - duplicated rather
      # than shared since each job runs on its own isolated runner.
      - name: Determine version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#mobile-v}"

          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            echo "::error::Tag '$TAG' is not a valid semver version (expected mobile-vMAJOR.MINOR.PATCH, e.g. mobile-v1.2.3)"
            exit 1
          fi

          echo "display_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "msbuild_args=/p:ApplicationDisplayVersion=$VERSION" >> "$GITHUB_OUTPUT"

      # History of what this restore step took to get right, since two different combinations
      # were tried and failed before landing here - worth knowing so a future reader doesn't
      # repeat either:
      #
      # 1. Restoring both RIDs in one pass via -p:RuntimeIdentifiers=win-x64%3Bwin-arm64 (plural
      #    property, %3B-escaped semicolon) combined with an explicit -p:TargetFramework=... hit
      #    NETSDK1083 ("RuntimeIdentifier 'win-x64;win-arm64' is not recognized") - something
      #    about combining an explicit single TargetFramework with a multi-value
      #    RuntimeIdentifiers, BOTH as raw command-line property overrides, collapses it back into
      #    a singular RuntimeIdentifier property somewhere in the SDK's own targets.
      #
      # 2. Restoring once per RID next to its own Publish step, using -p:TargetFramework=... -r
      #    <rid> (not -f - combining -f with -r on `dotnet restore` separately hit MSB1008, "Only
      #    one project can be specified", the TFM leaking through as a stray positional MSBuild
      #    argument) - avoided both of the above, but hit a THIRD problem: restore's raw
      #    -p:TargetFramework= override still leaked into Core's own restore (NETSDK1005,
      #    "doesn't have a target for 'net10.0'") even with Mobile.csproj's ProjectReference
      #    GlobalPropertiesToRemove correctly fixing the identical leak for Android's build/publish
      #    - and even with -p:RestoreUseStaticGraphEvaluation=false, which didn't help either.
      #
      # What actually works: this is the SAME pattern already proven for Android's restore (see
      # that job's own Restore step) - just `-f <TFM>`, no -r, no raw -p:TargetFramework=/
      # -p:RuntimeIdentifiers= overrides at all. RID awareness comes entirely from
      # Mobile.csproj's own declared, TFM-conditioned RuntimeIdentifiers property instead of any
      # CLI-level override - the two prior failures both involved raw CLI property overrides
      # fighting each other or leaking into Core's restore; this avoids that whole class of
      # problem by not using them. One restore now covers both win-x64 and win-arm64, same as
      # Android's one restore already covers both android-arm64 and android-x64.
      - name: Restore
        run: dotnet restore src/OpenCdsi.Mobile/OpenCdsi.Mobile.csproj -c Release -f net10.0-windows10.0.19041.0

      # --self-contained, not the framework-dependent default, because WindowsPackageType=None
      # (see the csproj) makes each of these an ordinary folder someone can unzip and run -
      # self-contained means they don't also need the matching .NET runtime installed first.
      # WindowsAppSDKSelfContained=true is the same idea one layer up: WinUI/the Windows App SDK
      # has its own separate runtime from .NET's, and --self-contained alone only bundles the
      # latter - without this flag too, the app would still fail to launch on a machine that never
      # had the Windows App SDK runtime installed. PublishReadyToRun=false: self-contained WinUI
      # publishes default this to true, which needs a R2R runtime pack that was never restored
      # (the Restore step above doesn't ask for it) and fails the build with NETSDK1094 - simplest
      # fix is to just not ask for that startup-time optimization on what's a one-off build, not a
      # shipping product.
      - name: Publish (Release, Windows, unpackaged win-x64)
        run: >
          dotnet publish src/OpenCdsi.Mobile/OpenCdsi.Mobile.csproj
          -f net10.0-windows10.0.19041.0
          -c Release
          -r win-x64
          --self-contained
          -p:WindowsAppSDKSelfContained=true
          -p:PublishReadyToRun=false
          --no-restore
          ${{ steps.version.outputs.msbuild_args }}

      - name: Zip win-x64 build
        shell: pwsh
        run: Compress-Archive -Path "src/OpenCdsi.Mobile/bin/Release/net10.0-windows10.0.19041.0/win-x64/publish/*" -DestinationPath "opencdsi-mobile-win-x64.zip"

      - name: Upload win-x64 build
        uses: actions/upload-artifact@v4
        with:
          name: opencdsi-mobile-windows-x64
          path: opencdsi-mobile-win-x64.zip
          if-no-files-found: error

      # Same as the win-x64 publish above, just -r win-arm64 - for a native ARM64 Windows VM
      # (e.g. UTM on Apple Silicon), rather than relying on Windows 11's x64 emulation to run the
      # x64 build. No separate restore needed here - the single combined Restore step above
      # already covers both win-x64 and win-arm64.
      - name: Publish (Release, Windows, unpackaged win-arm64)
        run: >
          dotnet publish src/OpenCdsi.Mobile/OpenCdsi.Mobile.csproj
          -f net10.0-windows10.0.19041.0
          -c Release
          -r win-arm64
          --self-contained
          -p:WindowsAppSDKSelfContained=true
          -p:PublishReadyToRun=false
          --no-restore
          ${{ steps.version.outputs.msbuild_args }}

      - name: Zip win-arm64 build
        shell: pwsh
        run: Compress-Archive -Path "src/OpenCdsi.Mobile/bin/Release/net10.0-windows10.0.19041.0/win-arm64/publish/*" -DestinationPath "opencdsi-mobile-win-arm64.zip"

      - name: Upload win-arm64 build
        uses: actions/upload-artifact@v4
        with:
          name: opencdsi-mobile-windows-arm64
          path: opencdsi-mobile-win-arm64.zip
          if-no-files-found: error

  release:
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: opencdsi-mobile-android
          path: apk

      - name: Download win-x64 build
        uses: actions/download-artifact@v4
        with:
          name: opencdsi-mobile-windows-x64
          path: windows

      - name: Download win-arm64 build
        uses: actions/download-artifact@v4
        with:
          name: opencdsi-mobile-windows-arm64
          path: windows

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            apk/**/*-Signed.apk
            windows/*.zip
