# Builds and tests Engine.slnx (Core, Contracts, Demo, plus Core.Tests and Conformance.Tests) on
# any push to main or PR that touches those projects, or the reference data they load.
#
# This repo is a monorepo with several independently-tagged solutions (see Engine.slnx,
# Backend.slnx, Mobile.slnx, Platform.slnx at the root) - this workflow is scoped to Engine.slnx's
# own dependency set via the paths filter below, so an Api/Functions-only or Mobile-only change
# doesn't trigger it. See build-backend.yml for the Api/Functions counterpart, and
# build-android.yml for Mobile.

name: Build and test Engine

on:
  push:
    branches: [main]
    paths:
      - 'src/OpenCdsi.VaxEngine.Core/**'
      - 'src/OpenCdsi.VaxEngine.Contracts/**'
      - 'src/OpenCdsi.VaxEngine.Demo/**'
      - 'tests/OpenCdsi.VaxEngine.Core.Tests/**'
      - 'tests/OpenCdsi.VaxEngine.Conformance.Tests/**'
      - 'data/**'
      - 'Engine.slnx'
  pull_request:
    paths:
      - 'src/OpenCdsi.VaxEngine.Core/**'
      - 'src/OpenCdsi.VaxEngine.Contracts/**'
      - 'src/OpenCdsi.VaxEngine.Demo/**'
      - 'tests/OpenCdsi.VaxEngine.Core.Tests/**'
      - 'tests/OpenCdsi.VaxEngine.Conformance.Tests/**'
      - 'data/**'
      - 'Engine.slnx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Full history/tags, not just the default shallow clone - Core.csproj's MinVer needs to
        # see engine-v* tags to compute a version, even for a plain build (not just the separate
        # publish-nuget.yml release workflow).
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Engine.slnx

      - name: Build
        run: dotnet build Engine.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Engine.slnx -c Release --no-build --logger "console;verbosity=normal"
