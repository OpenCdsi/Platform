# Builds and tests Engine.slnx (Core, Contracts, Demo, ClinicalReference, plus Core.Tests,
# Conformance.Tests, and ClinicalReference.Tests) on any push to main or PR that touches those
# projects, or the reference data they load.
#
# This repo is a monorepo with several independently-tagged solutions (see Engine.slnx,
# Backend.slnx, Mobile.slnx, Platform.slnx at the root) - this workflow is scoped to Engine.slnx's
# own dependency set via the paths filter below, so an Api/Functions-only or Mobile-only change
# doesn't trigger it. See build-backend.yml for the Api/Functions counterpart, and
# build-mobile.yml for Mobile.
#
# Core.Tests, Conformance.Tests, and ClinicalReference.Tests are run as three SEPARATE steps,
# deliberately treated differently, rather than one `dotnet test Engine.slnx` covering all three:
#   - Core.Tests and ClinicalReference.Tests are both unit-level correctness (the latter exercises
#     ClinicalReferenceRepository.Load against the real curated data/pinkbook content, the same
#     content bundled into the NuGet package - see publish-nuget-clinicalreference.yml) and are
#     expected to be 100% green - a failure in either hard-fails this job.
#   - Conformance.Tests runs the real 1064-case CDC corpus, which this engine does not yet fully
#     conform to (ongoing work, tracked as a pass-rate to improve over time, not a pass/fail
#     gate - see the project's own README for current status). `continue-on-error: true` means
#     its failures are reported in full but don't fail this job. A single combined
#     `dotnet test Engine.slnx` would make this workflow permanently red for a reason that has
#     nothing to do with whether a given change actually broke anything.

name: Build and test Engine

on:
  push:
    branches: [main]
    paths:
      - 'src/OpenCdsi.VaxEngine.Core/**'
      - 'src/OpenCdsi.VaxEngine.Contracts/**'
      - 'src/OpenCdsi.VaxEngine.Demo/**'
      - 'src/OpenCdsi.ClinicalReference/**'
      - 'tests/OpenCdsi.VaxEngine.Core.Tests/**'
      - 'tests/OpenCdsi.VaxEngine.Conformance.Tests/**'
      - 'tests/OpenCdsi.ClinicalReference.Tests/**'
      - 'data/**'
      - 'Engine.slnx'
  pull_request:
    paths:
      - 'src/OpenCdsi.VaxEngine.Core/**'
      - 'src/OpenCdsi.VaxEngine.Contracts/**'
      - 'src/OpenCdsi.VaxEngine.Demo/**'
      - 'src/OpenCdsi.ClinicalReference/**'
      - 'tests/OpenCdsi.VaxEngine.Core.Tests/**'
      - 'tests/OpenCdsi.VaxEngine.Conformance.Tests/**'
      - 'tests/OpenCdsi.ClinicalReference.Tests/**'
      - 'data/**'
      - 'Engine.slnx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Full history/tags, not just the default shallow clone - Core.csproj's MinVer needs to
        # see engine-v* tags to compute a version, even for a plain build (not just the separate
        # publish-nuget.yml release workflow).
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Engine.slnx

      - name: Build
        run: dotnet build Engine.slnx -c Release --no-restore

      - name: Test Core.Tests (blocking)
        run: >
          dotnet test tests/OpenCdsi.VaxEngine.Core.Tests/OpenCdsi.VaxEngine.Core.Tests.csproj
          -c Release --no-build --logger "console;verbosity=normal"

      - name: Test ClinicalReference.Tests (blocking)
        run: >
          dotnet test tests/OpenCdsi.ClinicalReference.Tests/OpenCdsi.ClinicalReference.Tests.csproj
          -c Release --no-build --logger "console;verbosity=normal"

      - name: Test Conformance.Tests (informational - known incomplete, doesn't fail the build)
        continue-on-error: true
        run: >
          dotnet test tests/OpenCdsi.VaxEngine.Conformance.Tests/OpenCdsi.VaxEngine.Conformance.Tests.csproj
          -c Release --no-build --logger "console;verbosity=normal"
