<!-- Custom Swagger UI shell - based on Swashbuckle.AspNetCore.SwaggerUI's own default
     embedded index.html (dumped from the installed 10.2.3 package to keep the required
     %(...) substitution tokens exact - see SwaggerUIMiddleware.GetIndexArguments), with an
     OpenCdsi.org header added above #swagger-ui and a footer added below it.

     Swagger UI renders its own topbar logo (linking to swagger.io) asynchronously, as part of
     a React tree mounted into #swagger-ui - there's no config option to suppress just the logo.
     An earlier version of this file waited for that node and physically relocated it into the
     footer via appendChild; confirmed by testing that this silently breaks it, because
     React attaches click handling via event delegation on its own root container
     (#swagger-ui) - once the node is moved outside that root, clicks bubble past it and the
     link does nothing (no href attribute either, so there's no native fallback). Instead: the
     original is hidden in place via CSS (#opencdsi-footer-link-source below), and the footer
     link is a plain, static recreation using swagger-ui-dist's own favicon-32x32.png (still
     served by Swashbuckle's EmbeddedResourceProvider regardless of the page's own favicon
     below, so this reference is unaffected by that) - no dependence on swagger-ui-dist's
     internal DOM/React structure, so it can't be silently broken by a future Swashbuckle/
     swagger-ui-dist version bump the way the live-DOM-move approach was.

     The page's own favicon (browser tab, bookmarks) is opencdsi.org's real favicon.ico
     (wwwroot/favicon.ico, pulled from https://opencdsi.org/assets/img/favicon.ico) rather
     than swagger-ui-dist's default - one .ico with multiple embedded sizes covers what the
     two separate favicon-16x16.png/favicon-32x32.png links did. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>%(DocumentTitle)</title>
    <link rel="stylesheet" type="text/css" href="%(StylesPath)">
    <link rel="stylesheet" type="text/css" href="./index.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    %(HeadContent)
    <style>
        /* Overlaid onto Swagger UI's own .topbar row instead of sitting in its own row above it,
           so the OpenCdsi.org logo/link and the "Select a definition" dropdown read as one line.
           This works because hiding .swagger-ui .topbar .link below (Swagger's own logo) leaves
           its layout space empty rather than collapsing it: .topbar .download-url-wrapper has a
           216px margin-left baked into swagger-ui.css to sit next to that logo, confirmed by
           measuring the live layout - that's exactly the reserved slot this now fills.
           position:absolute takes #opencdsi-header out of document flow entirely, so #swagger-ui
           (and .topbar, its first child) shifts up to occupy the row this would otherwise have
           taken - no explicit "position:relative" needed on an ancestor for that top:0/left:0 to
           land in the right place, since nothing else establishes one. No hardcoded height: this
           box's own intrinsic height (padding + the 32px logo) lands within a pixel or two of
           .topbar's own (padding + its ~30px form control) - a coincidence of both using the
           same 10px vertical padding, not a value copied from swagger-ui.css. */
        #opencdsi-header {
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 10px 20px;
            z-index: 1;
        }
        #opencdsi-header a {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: #fff;
            text-decoration: none;
            font-family: sans-serif;
            font-weight: 600;
            font-size: 16px;
        }
        /* #F27A30 is opencdsi.org's own --brand-orange CSS variable, not this repo's
           Colors.xaml BrandAccent (#F58231) - the two have drifted slightly apart, and this
           was asked to match the home page specifically. */
        #opencdsi-header a span {
            transition: color 0.15s ease;
        }
        #opencdsi-header a:hover span {
            color: #F27A30;
        }
        #opencdsi-header img {
            height: 32px;
            width: 32px;
        }
        /* Hides Swagger UI's own top-left logo/link in place (not removed - see header comment
           above for why moving the actual node breaks it). The "Select a definition" dropdown
           next to it is a different element and is unaffected. */
        .swagger-ui .topbar .link {
            display: none;
        }
        /* Reserves room for #opencdsi-header's overlay by padding the row it sits in, rather
           than touching .download-url-wrapper directly. swagger-ui.css gives that element
           `margin-left:auto` (a flexbox trick that pushes it - and only it - to the row's right
           edge) plus `flex:3`/`max-width:600px`; a wide container leaves the auto-margin some
           free space to absorb, so it hugs the right edge, but a narrower one has the element
           grow to fill the whole row instead, since flex-grow is resolved before any leftover
           space reaches the auto margin - which is exactly why it slid left under our overlaid
           logo/text at a ~530px test width. An EARLIER version of this rule "fixed" that by
           forcing a flat `margin-left:216px !important` on the element - it stopped the overlap,
           but also permanently overrode that auto-margin push-right behavior, so the dropdown
           stopped hugging the right edge at every width instead, reported as looking centered in
           the topbar rather than right-aligned. Padding the row's own left edge instead shrinks
           the space that auto-margin math runs over, so download-url-wrapper's built-in
           right-alignment keeps working unmodified at every width. */
        .swagger-ui .topbar .topbar-wrapper {
            padding-left: 200px;
        }
        /* Removes the light/dark mode switch from the topbar - this page doesn't support a dark
           mode of its own (the OpenCdsi brand palette below is one fixed light theme), so the
           toggle would just break the page's own styling if clicked. */
        .swagger-ui .topbar .dark-mode-toggle {
            display: none;
        }
        #opencdsi-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 14px;
            background-color: #1b1b1b;
            border-top: 1px solid #333;
            font-family: sans-serif;
            font-size: 12px;
            color: #ccc;
        }
        #opencdsi-footer a {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ccc;
            text-decoration: none;
        }
        #opencdsi-footer a:hover {
            color: #fff;
        }
        #opencdsi-footer img {
            height: 18px;
            width: 18px;
        }

        /* OpenCdsi brand palette applied to the body Swagger UI itself renders - the exact hex
           values from src/OpenCdsi.Mobile/Resources/Styles/Colors.xaml's BrandPrimary/
           BrandSecondary/BrandAccent/BrandPrimaryTint (derived from the logo mark), so the API
           docs and the mobile app read as the same product. Deliberately leaves the
           opblock-summary-method GET/POST/etc. colors alone - swagger-ui.css's own selectors
           for those aren't touched here, consistent with Colors.xaml's own comment that brand
           colors and semantic/status colors are kept separate on purpose.
           This must come after %(StylesPath)'s <link> above to win the cascade (equal
           specificity, later wins) without needing !important. */
        .swagger-ui {
            background-color: #F7F6F3; /* SurfacePage */
        }
        .swagger-ui .scheme-container {
            background-color: #FFFFFF; /* SurfaceCard */
            border: 1px solid #E3E1D9; /* Border */
            box-shadow: none;
        }
        .swagger-ui .info a {
            color: #911EB4; /* BrandPrimary */
        }
        .swagger-ui .info a:hover {
            color: #4363D8; /* BrandSecondary */
        }
        .swagger-ui .info .title small.version-stamp {
            background-color: #F58231; /* BrandAccent */
        }
        /* Tag headers (VaxEngine/Supporting Data/Clinical Reference) deliberately left at
           swagger-ui's own default text color (near-black, no override here) rather than a
           brand color - tried BrandPrimary (purple), then BrandSecondary (blue), and both
           still fought with swagger-ui's own blue/green (GET/POST method colors, links). The
           logo and the "v3" badge already carry enough brand color on this page. */
        .swagger-ui .btn.execute {
            background-color: #911EB4; /* BrandPrimary */
            border-color: #911EB4;
        }
        .swagger-ui .btn.execute:hover {
            background-color: #4363D8; /* BrandSecondary */
            border-color: #4363D8;
        }
        .swagger-ui select:focus {
            border-color: #911EB4; /* BrandPrimary */
        }
    </style>
</head>

<body>
    <header id="opencdsi-header">
        <a href="https://opencdsi.org" target="_blank" rel="noopener noreferrer">
            <img src="/opencdsi-logo.svg" alt="OpenCdsi.org logo" />
            <span>opencdsi.org</span>
        </a>
    </header>

    <div id="swagger-ui"></div>

    <footer id="opencdsi-footer">
        <span>Powered by</span>
        <a href="https://swagger.io" target="_blank" rel="noopener noreferrer">
            <img src="./favicon-32x32.png" alt="Swagger UI logo" />
            <span>Swagger UI</span>
        </a>
    </footer>

    <script src="%(ScriptBundlePath)" charset="utf-8"></script>
    <script src="%(ScriptPresetsPath)" charset="utf-8"></script>
    <script src="index.js" charset="utf-8"></script>
</body>
</html>
